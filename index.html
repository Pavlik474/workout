<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Тренировки</title>

<style>
:root{--bg:#0a0a0a;--card:#1a1a1a;--card2:#242424;--tx:#fff;--mut:#8a8f98;--g:#22c55e;--gd:#14391f;box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px -apple-system,system-ui,sans-serif}
*{box-sizing:border-box}
#app{max-width:520px;margin:0 auto;padding:12px 16px 210px}
.top{display:flex;gap:8px;margin-bottom:12px}
.top button{flex:1}
button{font:inherit;color:var(--tx);background:var(--card);border:0;border-radius:14px;padding:12px;cursor:pointer}
button.on{background:var(--card2);outline:1px solid var(--g)}
.tabs{display:flex;background:var(--card);border-radius:16px;padding:6px;margin-bottom:16px}
.tabs button{flex:1;background:none;color:var(--mut);font-weight:600}
.tabs button.on{background:var(--card2);color:var(--tx);outline:0}
h3{color:var(--mut);font-size:15px;letter-spacing:.05em;margin:18px 6px 8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:8px;width:100%;text-align:left}
.item b{display:block;font-weight:500}.item small{color:var(--mut);font-size:16px}
.num{min-width:30px;height:30px;border-radius:15px;background:var(--card2);display:grid;place-items:center;font-size:14px;color:var(--mut)}
.num.ok{background:var(--gd);color:var(--g)}
.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.nav button{width:46px;height:46px;border-radius:23px;padding:0;color:var(--g);font-size:22px}
h2{text-align:center;font-size:26px;margin:8px 0 14px}
.vid{display:block;width:max-content;margin:0 auto 20px;background:var(--card);border-radius:22px;padding:10px 22px;color:var(--tx);text-decoration:none}
.vid:before{content:"▶ ";color:var(--g)}
.set{display:flex;align-items:center;background:var(--card);border-radius:16px;margin-bottom:8px;padding:6px 8px 6px 16px;gap:8px}
.set input{background:none;border:0;color:var(--tx);font:inherit;width:100%;min-width:0;padding:12px 0;outline:0}
.set input::placeholder{color:#5b6068}
.set i{width:1px;height:34px;background:#333}
.set button{background:var(--gd);color:var(--g);width:54px;height:44px;border-radius:22px;padding:0;font-size:22px;flex:none}
.set.done button{background:var(--g);color:#000}
.row2{display:flex;margin:14px 0}.row2 button{flex:1;background:none;color:var(--mut)}
textarea{width:100%;background:var(--card);color:var(--tx);border:0;border-radius:14px;padding:12px;font:inherit;margin-bottom:8px}
.hist{background:var(--card);border-radius:16px;padding:12px 16px;color:var(--mut);font-size:15px;line-height:1.6}

.timer .t{flex:1;text-align:center;font-size:30px;font-weight:700;color:#b8bcc4;font-variant-numeric:tabular-nums}
.timer .s{background:var(--gd);color:var(--g);font-weight:700;padding:12px 20px;border-radius:22px}
.timer .p{width:40px;height:40px;padding:0;background:none;color:var(--mut);font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px;justify-content:center}.chips button{padding:8px 12px;font-size:15px;border-radius:18px}
.empty{color:var(--mut);padding:20px 6px}
.th{width:56px;height:56px;border-radius:12px;object-fit:cover;background:#fff;flex:none}
.kcard{width:100%;text-align:left;display:flex;align-items:center;gap:16px;padding:22px 20px;margin-bottom:12px;border-radius:20px;background:linear-gradient(135deg,#14391f,#1a1a1a)}
.kcard span{font-size:34px}.kcard b{display:block;font-size:22px}.kcard small{color:var(--mut);font-size:15px}
.bg{background:var(--gd);color:var(--g);border-radius:14px;padding:4px 12px;font-size:14px;white-space:nowrap}
.ar{line-height:1.55;margin:0 4px 14px}
.sub{color:var(--mut);margin:4px 6px 12px;font-size:15px}
#bar{position:fixed;left:0;right:0;bottom:0;background:#0d0d0d;border-top:1px solid #1f1f1f;display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0));z-index:5}
#bar button{background:none;border-radius:12px;padding:4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mut);min-width:62px}
#bar button i{font-style:normal;font-size:22px;filter:grayscale(1) opacity(.6)}
#bar button.on{color:var(--tx)}#bar button.on i{filter:none}
#bar .c{width:58px;height:58px;border-radius:29px;background:var(--gd);color:var(--g);min-width:0;padding:0;justify-content:center;margin-top:-20px;box-shadow:0 0 0 5px var(--bg)}
#bar .c.on{background:var(--g);color:#000}
.hist{margin-bottom:8px;color:var(--tx);font-size:16px}.hh{display:flex;gap:10px;align-items:center;margin-bottom:4px}.hh span:last-child{margin-left:auto;color:var(--mut);font-size:14px}
.tg{font-size:12px;padding:2px 8px;border-radius:10px}.tg.h{background:#3b2410;color:#fb923c}.tg.l{background:var(--gd);color:var(--g)}
.seg{display:flex;gap:4px;margin:18px 0 8px}.seg button{padding:6px 10px;font-size:13px;border-radius:14px;color:var(--mut)}.seg button.on{color:var(--tx);outline:1px solid var(--g)}
.cd .dn{font-size:11px;color:var(--mut);font-weight:400}.cd .bd{font-size:21px;line-height:1.1}
.cd.tr.d1{background:#14391f;color:#22c55e}.cd.tr.d2{background:#10294a;color:#60a5fa}.cd.tr.d3{background:#3b2410;color:#fb923c}
.wd,.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.wd{color:var(--mut);font-size:13px;margin-bottom:6px}
.cd{aspect-ratio:1;padding:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:16px;background:var(--card)}.cd small{font-size:10px;color:var(--g)}.cd.tr{background:var(--gd);color:var(--g);font-weight:700}.cd.td{outline:1px solid var(--mut)}.cd.sl{outline:2px solid var(--g)}

 PROFILES.forEach((g,p)=>LEVELS.forEach((lv,l)=>{h+=`<button class="item" data-pr="${p}_${l}" style="justify-content:space-between${p==S.p&&l==S.l?";outline:1px solid var(--g)":""}"><div><b>Full Body</b><small>${g} · ${lv} · 3 дня в неделю</small></div><span>›</span></button>`}));
 return h}
function bkView(){let h="";h+=`<h3>РЕЗЕРВНАЯ КОПИЯ</h3><div class="row2" style="margin:0 0 8px"><button data-bk="out">Показать копию</button><button data-bk="in">Восстановить</button></div><textarea id="bk" rows="3" placeholder="Чтобы восстановить, вставьте сюда сохранённый текст">${esc(S.bk||"")}</textarea>`+(S.msg?`<div class="empty">${esc(S.msg)}</div>`:"");return h}
function profView(){return '<h3>ПРОГРАММА</h3>'+profBar(1)+'<h3>ТИП НЕДЕЛИ</h3><div class="top"><button class="'+(DB._wk!=="h"?"on":"")+'" data-wk="l">Лёгкая</button><button class="'+(DB._wk==="h"?"on":"")+'" data-wk="h">Тяжёлая</button></div>'+bkView()}
function histHtml(n,all){const a=(DB[n]||[]).filter(x=>all||x.d!==today()).sort((p,q)=>p.d<q.d?1:-1);return a.length?a.map(x=>{const st=x.sets.filter(y=>y.ok||y.w||y.r);return `<div class="hist"><div class="hh"><b>${fd(x.d)}</b>${x.wk?`<span class="tg ${x.wk}">${x.wk==="h"?"тяжёлая":"лёгкая"}</span>`:""}<span>${st.length} подх.</span></div>${st.map(y=>y.w||y.r?(y.w||"?")+" кг × "+(y.r||"?"):"выполнено").join(" · ")}${x.note?`<div>${esc(x.note)}</div>`:""}</div>`}).join(""):'<div class="empty">Пока нет записей.</div>'}
const KN=typeof KNOW!=="undefined"?KNOW:{},BD=typeof BODY!=="undefined"?BODY:{};
function th(n,hide){const id=VID[n];return id?`<img class="th" alt="" src="img/${id}.jpg" style="display:none" onload="this.style.display='';${hide?"this.previousElementSibling.style.display='none';":""}" onerror="this.remove()">`:""}
function bigImg(n){const id=VID[n];return id?`<img alt="" src="img/${id}.jpg" style="display:none;width:200px;height:200px;object-fit:cover;border-radius:18px;margin:0 auto 12px;background:#fff" onload="this.style.display='block'" onerror="this.remove()">`:""}
function libView(){const ic={tr:"🏋️",food:"🥗",diet:"🍽️",rec:"🥘"};let h="<h3>БАЗА ЗНАНИЙ</h3>";for(const k in KN){const n=KN[k].s.reduce((a,x)=>a+x.i.length,0);h+=`<button class="kcard" data-kc="${k}"><span>${ic[k]||"📄"}</span><div><b>${esc(KN[k].t)}</b><small>${n?n+" статей":"скоро"}</small></div></button>`}return h}
function catView(){const K=KN[S.kc];let h=`<div class="nav"><button data-tab="lib">‹</button><span>${esc(K.t)}</span><span style="width:46px"></span></div>`;
 K.s.forEach((s,si)=>{h+=`<h3>${esc(s.h)}</h3>`+s.i.map((a,ii)=>`<button class="item" data-ka="${si}_${ii}" style="justify-content:space-between"><b style="flex:1">${a[2]?"🆕 ":""}${esc(a[0])}</b>${a[1]?`<span class="bg">${esc(a[1])}</span>`:""}<span>›</span></button>`).join("")});
 if(S.kc==="tr")h+='<h3>УПРАЖНЕНИЯ</h3><button class="item" data-tab="kx" style="justify-content:space-between"><b style="flex:1">База упражнений: видео и история</b><span>›</span></button>';
 if(!K.s.length)h+='<div class="empty">Раздел пока пуст.</div>';return h}
function artView(){const q=S.ka.split("_"),K=KN[S.kc],a=K.s[+q[0]].i[+q[1]],b=BD[a[0]];return `<div class="nav"><button data-kc="${S.kc}">‹</button><span>${esc(K.t)}</span><span style="width:46px"></span></div><h2 style="text-align:left">${esc(a[0])}</h2>`+(b?b.split("\n\n").map(p=>`<p class="ar">${esc(p)}</p>`).join(""):'<div class="empty">Текст этой статьи пока не добавлен.</div>')}
function exView(){let h='<div class="nav"><button data-kc="tr">‹</button><span>Упражнения</span><span style="width:46px"></span></div>';LN.forEach((n,k)=>{const c=(DB[n]||[]).filter(s=>s.sets.some(x=>x.ok)).length;h+=`<button class="item" data-lx="${k}" style="justify-content:space-between">${th(n)}<div style="flex:1"><b>${esc(n)}</b>${c?`<small>выполнено раз: ${c}</small>`:""}</div><span>›</span></button>`});return h}
function lxView(){const n=LN[S.lx],id=VID[n];return `<div class="nav"><button data-tab="kx">‹</button><span>Упражнения</span><span style="width:46px"></span></div><h2>${esc(n)}</h2><video controls playsinline preload="metadata" poster="img/${id}.jpg" src="videos/${id}.mp4" style="width:100%;border-radius:14px;margin-bottom:10px;background:#000" onerror="this.outerHTML='<div class=empty>Видео не найдено: videos/${id}.mp4</div>'"></video><h3>ИСТОРИЯ ВЫПОЛНЕНИЙ</h3>`+histHtml(n,1)}
function profBar(lv){const b=(a,k,c)=>'<div class="top">'+a.map((n,i)=>`<button class="${i==S[k]?"on":""}" data-${c}="${i}">${n}</button>`).join("")+"</div>";return b(PROFILES,"p","p")+(lv?b(LEVELS,"l","l"):"")}
function viewBar(){return '<div class="top">'+[["plan","Тренировка"],["cal","Календарь"]].map(([v,n])=>`<button class="${v===S.v?"on":""}" data-v="${v}">${n}</button>`).join("")+"</div>"}
const fd=d=>d.split("-").reverse().join(".");
function dayNum(id,tr){if(DB._days&&DB._days[id]!==undefined)return DB._days[id]+1;const nm=tr.map(x=>x[0]);let best=0,bn=0;DAYS.forEach((D,k)=>{const n=D.ex.filter(e=>e.o.some(o=>nm.includes(o[0]))).length;if(n>bn){bn=n;best=k+1}});return best}
function dayData(){const r={};for(const k in DB){if(k[0]==="_")continue;for(const s of DB[k]){const ok=s.sets.filter(x=>x.ok);if(ok.length)(r[s.d]=r[s.d]||[]).push([k,ok,s.note,s.wk])}}return r}
function calView(){
 if(!S.m){const n=new Date();S.m=[n.getFullYear(),n.getMonth()]}
 if(S.sel===undefined)S.sel=today();
 const [y,m]=S.m,dd=dayData(),first=(new Date(y,m,1).getDay()+6)%7,len=new Date(y,m+1,0).getDate(),t=today();
 let cnt=0,cells="";
 for(let i=0;i<first;i++)cells+="<span></span>";
 for(let d=1;d<=len;d++){const id=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0"),tr=dd[id];if(tr)cnt++;
  const dl=tr?dayNum(id,tr):0;
  cells+=`<button class="cd ${tr?"tr d"+dl:""} ${id===t?"td":""} ${id===S.sel?"sl":""}" data-s="${id}">${tr?`<span class="dn">${d}</span><b class="bd">${dl||"•"}</b>`:d}</button>`}
 let h=`<div class="nav"><button data-m="-1">‹</button><b>${MON[m]} ${y}</b><button data-m="1">›</button></div>`;
 h+='<div class="wd">'+["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>"<span>"+x+"</span>").join("")+'</div><div class="cg">'+cells+"</div>";
 h+=`<h3>ТРЕНИРОВОК В МЕСЯЦЕ: ${cnt}</h3>`;
 if(S.sel){const a=dd[S.sel];h+=`<h3>${S.sel.split("-").reverse().join(".")}</h3>`+(a?a.map(([n,ok,note,wk])=>`<div class="item"><div><b>${esc(n)}${wk?` <span class="tg ${wk}">${wk==="h"?"тяжёлая":"лёгкая"}</span>`:""}</b><small>${ok.map(x=>x.w||x.r?(x.w||"?")+" кг × "+(x.r||"?"):"выполнено").join(", ")}${note?" — "+esc(note):""}</small></div></div>`).join(""):'<div class="empty">В этот день тренировки не было.</div>')}
 
 return h}
document.addEventListener("click",ev=>{
 const t=ev.target.closest("[data-p],[data-d],[data-o],[data-n],[data-c],[data-vid],[data-x],[data-v],[data-m],[data-s],[data-bk],[data-l],[data-wk],[data-tab],[data-pr],[data-lx],[data-kc],[data-ka],[data-k],[data-add],[data-note],[data-h]");if(!t)return;
 const D=t.dataset;
 if(D.p!==undefined){S.p=+D.p;prog();ui()}
 else if(D.l!==undefined){S.l=+D.l;prog();ui()}
 else if(D.d!==undefined)S.d=+D.d;
 else if(D.o!==undefined){S.v="ex";S.i=+D.o;S.hist=0;S.note=0;S.vid=0}
 else if(D.n!==undefined){const n=DAYS[S.d].ex.length;S.i=(S.i+ +D.n+n)%n;S.hist=0;S.note=0;S.vid=0}
 else if(D.x!==undefined)S.v="plan";
 else if(D.c!==undefined){DB._sel=DB._sel||{};DB._sel[S.d+"_"+S.i]=+D.c;S.vid=0;save()}
 else if(D.vid!==undefined)S.vid=!S.vid;
 else if(D.tab!==undefined){S.v=D.tab;S.msg="";window.scrollTo(0,0)}
 else if(D.pr!==undefined){const q=D.pr.split("_");S.p=+q[0];S.l=+q[1];prog();ui();S.v="plan"}
 else if(D.lx!==undefined){S.lx=+D.lx;S.v="lx";window.scrollTo(0,0)}
 else if(D.kc!==undefined){S.kc=D.kc;S.v="kc";window.scrollTo(0,0)}
 else if(D.ka!==undefined){S.ka=D.ka;S.v="ka";window.scrollTo(0,0)}
 else if(D.wk!==undefined){DB._wk=D.wk;for(const k in DB){if(k[0]==="_")continue;for(const s of DB[k])if(s.d===today())s.wk=D.wk}save()}
 else if(D.v!==undefined){S.v=D.v;S.msg=""}
 else if(D.m!==undefined){let [y,m]=S.m;m+=+D.m;if(m<0){m=11;y--}if(m>11){m=0;y++}S.m=[y,m]}
 else if(D.s!==undefined)S.sel=D.s;
 else if(D.bk==="out"){S.bk=JSON.stringify(DB);S.msg="Скопируйте этот текст и сохраните в заметках."}
 else if(D.bk==="in"){try{const o=JSON.parse(document.getElementById("bk").value);if(typeof o!=="object"||!o)throw 0;DB=o;save();S.bk="";S.msg="Данные восстановлены."}catch(e){S.msg="Не удалось прочитать копию."}}
 else if(D.k!==undefined){const x=sess(S.d,S.i).sets[+D.k];x.ok=x.ok?0:1;DB._days=DB._days||{};DB._days[today()]=S.d;save()}
 else if(D.add!==undefined){sess(S.d,S.i).sets.push({w:"",r:"",ok:0});save()}
 else if(D.note!==undefined)S.note=1;
 else if(D.h!==undefined)S.hist=!S.hist;
 render();
});
document.getElementById("app").addEventListener("input",ev=>{
 const t=ev.target;if(S.v!=="ex")return;const s=sess(S.d,S.i);
 if(t.dataset.w!==undefined)s.sets[+t.dataset.w].w=t.value;
 else if(t.dataset.r!==undefined)s.sets[+t.dataset.r].r=t.value;
 else if(t.dataset.t!==undefined)s.note=t.value;
 save();
});
// ===== Таймер отдыха =====
let secs=180,run=0,iv=null;
const tt=document.getElementById("tt"),ts=document.getElementById("ts");
const fmt=n=>Math.floor(n/60)+":"+String(n%60).padStart(2,"0");
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.6)}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
function stop(){clearInterval(iv);run=0;ts.textContent="СТАРТ"}
ts.onclick=()=>{if(run){stop();tt.textContent=fmt(secs);return}
 let end=Date.now()+secs*1000;run=1;ts.textContent="СТОП";
 iv=setInterval(()=>{const r=Math.max(0,Math.round((end-Date.now())/1000));tt.textContent=fmt(r);if(r<=0){stop();beep();tt.textContent=fmt(secs)}},250)};
document.getElementById("tm").onclick=()=>{if(!run){secs=Math.max(15,secs-15);tt.textContent=fmt(secs)}};
document.getElementById("tp").onclick=()=>{if(!run){secs+=15;tt.textContent=fmt(secs)}};
(async()=>{TG&&(TG.ready(),TG.expand());await load();if(DB._ui){S.p=DB._ui[0]|0;S.l=DB._ui[1]|0}prog();render()})();
</script></body></html>
